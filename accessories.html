<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessories</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <section class="container">
        <a class="navbar-brand" href="index.html">Aptec Computers</a>
        <a href="cart.html">🛒 Cart</a>
    </section>
</nav>

<main class="container mt-4">

    <h2>Accessories</h2>

    <section id="products">

        <article class="product-item">
            <h3>Mouse</h3>
            <img src="images/Mouse.png" alt="Add mouse image" class="img-medium">
            <p>Cord</p>
            <p>P 338.73</p>
            <button onclick="addToCart('Mouse',338.73)">Add to Cart</button>
        </article>

        <article class="product-item">
            <h3>Keyboard</h3>
            <img src="images/Keyboard.avif" alt="Add keyboard image" class="img-medium">
            <p>RGB Mechanical</p>
            <p>P 1083.95</p>
            <button onclick="addToCart('Keyboard',1083.95)">Add to Cart</button>
        </article>

        <article class="product-item">
            <h3>Headsets</h3>
            <img src="images/Headsets.webp" alt="Add headsets image" class="img-medium">
            <p>Bluetooth connectivity</p>
            <p>P 559.95</p>
            <button onclick="addToCart('Headsets',559.95)">Add to Cart</button>
        </article>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
