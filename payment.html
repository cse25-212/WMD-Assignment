<!DOCTYPE html>
<html>

<head>
    <title>Payment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="bg-dark text-white text-center py-3">
    <h1>Checkout / Payment</h1>
</header>

<main class="container my-5">

    <section class="card p-4 shadow">

        <h3>Billing Details</h3>

        <form>

            <input type="text" class="form-control mb-2" placeholder="Full Name" required>

            <input type="email" class="form-control mb-2" placeholder="Email" required>

            <input type="text" class="form-control mb-2" placeholder="Address" required>

            <select class="form-control mb-2">
                <option>Credit Card</option>
                <option>Debit Card</option>
                <option>Cash on Delivery</option>
            </select>

            <button type="submit" class="btn btn-success w-100">
                Confirm Payment
            </button>

        </form>

    </section>

</main>

</body>
</html>
